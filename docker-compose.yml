services:
  postgres:
    image: postgres:16
    container_name: senda-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: senda
    ports:
      - "5432:5432"
    volumes:
      - senda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d senda"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  senda_pgdata:
